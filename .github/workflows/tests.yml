name: tests
# Every push and pull request runs the full test suite: urgency rules, reader safety net, planner limits,
# data sanity and the simulation's bookkeeping (tests/).
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests
      - name: portal code parses
        run: node -e "new Function(require('fs').readFileSync('web/app.js','utf8'))"
