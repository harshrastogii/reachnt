# ReachNT parameters.
# Every value is tagged: `source` means it comes from a document or dataset (see research/RESEARCH.md),
# `ASSUMPTION` means we chose it, `model` is a setting of the method (seed, solver, grid sizes), not a claim about the world.
# The assumptions that move results most are swept in experiments.sensitivity().

seed: 20261007                     # model: request stream; the road-closure and missed-visit streams are derived from the year's seed

# ------------------------------------------------------------------ service clocks
clocks:
  # NT DHLGCD Fact sheet FS17 (10/25). source
  official:
    immediate_hours: 4
    urgent_business_days: {town: 2, remote: 5}
    routine_business_days: {town: 10, remote: 25}
  # ReachNT default: one clock for everyone (the remote allowance becomes an owned policy choice). ASSUMPTION
  equal:
    immediate_hours: 4
    urgent_business_days: {town: 2, remote: 2}
    routine_business_days: {town: 10, remote: 10}

# ------------------------------------------------------------------ geography
hubs:   # crew bases. source: NT regional service towns (as in Underlink restore.depots)
  Darwin:        {lat: -12.46, lon: 130.84, town_houses: 2604}   # town_houses: ABS 2021 Census I13, households renting from the state housing authority, ILOC703xx (Darwin + Palmerston)
  Katherine:     {lat: -14.47, lon: 132.26, town_houses: 265}    # ILOC70500502 Katherine exc. Town Camps
  Tennant Creek: {lat: -19.65, lon: 134.19, town_houses: 162}    # ILOC70700504
  Alice Springs: {lat: -23.70, lon: 133.88, town_houses: 798}    # ILOC7080xx Alice Springs suburbs
  Nhulunbuy:     {lat: -12.18, lon: 136.78, town_houses: 35}     # ILOC70600502
islands:        # no road access; fly-in (or barge for bulk). source: geography
  - WURRUMIYANGA
  - MILIKAPITI
  - PIRLANGIMPI
  - ANGURUGU
  - UMBAKUMBA
  - MILYAKBURRA
  - GALIWINKU
  - MILINGIMBI
  - WARRUWI
  - MINJILANG
travel:
  circuity: 1.2              # ASSUMPTION road km / straight-line km
  road_speed_kmh: 70         # ASSUMPTION blended speed hub -> community (highway + unsealed access + stops).
                             # The NTG places table cannot separate sealed highway from unsealed access road.
  drive_hours_per_day: 9     # ASSUMPTION (fatigue rules)
  flight_speed_kmh: 300      # ASSUMPTION light twin
  airstrip_radius_km: 8      # ASSUMPTION airstrip "serves" a community within this distance (OurAirports)
  remote_band_hours: 2       # source: Nous 2017 "Remote > 2 hours travel from regional centre"
  very_remote_band_hours: 6  # source: Nous 2017 "Very Remote > 6 hours"
access:
  # Known closures: NT Annual Traffic Report 2023 restriction register (CC BY), category "Road Closed",
  # matched to the road a community depends on. Months are inclusive.
  register_closures:
    LAJAMANU:      {road: LAJAMANU ROAD, months: [11, 12, 1, 2, 3, 4]}
    GUNBALANYA:    {road: "OENPELLI ROAD (Cahills Crossing)", months: [11, 12, 1, 2, 3, 4, 5]}
    AMANBIDJI:     {road: AMANBIDJI ACCESS ROAD, months: [1, 2, 3, 4, 5]}
    ALPURRURULAM:  {road: SANDOVER HIGHWAY, months: [12, 1, 2, 3, 4]}
    YARRALIN:      {road: BUCHANAN HIGHWAY, months: [12, 1]}
    NAUIYU:        {road: DALY RIVER LOW LEVEL ROAD, months: [2, 3, 4]}
    WADEYE:        {road: "DALY RIVER LOW LEVEL ROAD (Port Keats route)", months: [2, 3, 4]}
    PEPPIMENARTI:  {road: "DALY RIVER LOW LEVEL ROAD (Port Keats route)", months: [2, 3, 4]}
    NGANMARRIYANGA: {road: "DALY RIVER LOW LEVEL ROAD (Port Keats route)", months: [2, 3, 4]}
    NGUKURR:       {road: ROPER HIGHWAY, months: [3]}
    NUMBULWAR:     {road: ROPER HIGHWAY, months: [3]}
    KALKARINDJI:   {road: BUNTINE HIGHWAY, months: [3]}
    DAGURAGU:      {road: BUNTINE HIGHWAY, months: [3]}
    APATULA (FINKE): {road: GHAN HERITAGE ROAD, months: [2]}
  # Roads the register does not cover (council and access roads): a Top End community (north of this
  # latitude) more than this many hours from its hub is treated as cut on a share of wet-season weeks. ASSUMPTION
  wet_min_hours: 2.0
  wet_lat_north_of: -17.5
  wet_months: [12, 1, 2, 3]
  wet_cut_week_share: 0.35   # ASSUMPTION; swept [0.2, 0.35, 0.5]

# ------------------------------------------------------------------ H3 (Uber's hexagonal grid, h3geo.org)
h3:
  house_res: 10            # a house is stored as its res-10 cell (~0.015 km2, ~76 m edge), never as an address
  settlement_res: 7        # ~5.2 km2: the community footprint
  run_res: 4               # ~1,770 km2, ~26 km edge: run zones are built on this grid
  run_k: 2                 # two communities share a run if their res-4 cells are within 2 rings (about 90 km). ASSUMPTION
  public_res: 6            # ~36 km2: anything shown outside the department is aggregated to res 6 ...
  public_min_count: 5      # ... and suppressed below 5 (k-anonymity)
  nearby_k: 3              # "while you're there": res-5 rings searched around a tradesperson's current cell
  house_ring_k: 2          # without mapped buildings, synthetic houses sit within 2 res-10 rings (~150 m) of the OSM settlement point
  min_building_cells: 8    # with at least this many res-10 cells holding OSM buildings, houses go on those cells
  town_ring_k: 30

# ------------------------------------------------------------------ demand
demand:
  reports_per_house_year: 4.0      # ASSUMPTION responsive requests only (APY all-work rate is ~26/house/yr incl. planned, Grealy 2022)
  wet_season_uplift: 1.25          # ASSUMPTION more roof leaks, storm damage, aircon and pest reports Nov-Apr
  weeks: 52                        # model
  start_month: 7                   # model: simulate Jul..Jun (financial year)
  # The synthetic request stream (synth.request_stream). ASSUMPTIONS unless marked.
  rarity: {immediate: 0.35, urgent: 1.0, routine: 1.4}   # ASSUMPTION: dangerous faults are rarer than routine ones (x the APY trade share)
  wet_heavy_faults: [roof_leak, aircon_fan, pests, no_power, electrical_danger, sewage_overflow]
  wet_heavy_factor: 1.6            # ASSUMPTION: these faults are this much more likely in a wet-season report
  household_share:                 # ASSUMPTION: share of reports whose household has each circumstance (and says so in the report)
    vulnerable: 0.3                #   Tier 1 or Tier 2 (the wording decides which)
    crowded_town: 0.1
    crowded_remote: 0.35
    repeat: 0.12
  heldout_share: 0.3               # ASSUMPTION: share of reports worded in phrasings the reader never trained on

# ------------------------------------------------------------------ crews and costs
crews:
  # Trades per hub and trade are sized from expected weekly job hours: n = ceil(capacity_factor x hours / 40).
  # A factor near 1 means "too few trades": the crew can clear the work only if it spends little time travelling.
  capacity_factor: 1.3        # ASSUMPTION; swept [1.15, 1.3, 1.5]
  hours_per_week: 40          # ASSUMPTION
  min_per_hub: 1              # ASSUMPTION
costs:
  labour_per_hour: 130       # ASSUMPTION trade rate incl. on-costs (AUD)
  hours_per_day: 8           # ASSUMPTION
  vehicle_per_km: 1.10       # ASSUMPTION 4WD running cost
  overnight_per_night: 320   # ASSUMPTION remote accommodation + allowance
  charter_per_hour: 2200     # ASSUMPTION light twin charter (round trip hours billed)
  town_travel_per_job: 40    # ASSUMPTION in-town driving per job
  calibration_target:        # source: Nous 2017 - travel up to 96% of per-unit emergency cost; planned 11-37%
    single_job_travel_share_very_remote: 0.96
    batched_travel_share_range: [0.11, 0.37]

# ------------------------------------------------------------------ planning
planning:
  max_onsite_days_per_trip: 5   # ASSUMPTION
  # CP-SAT stops on a deterministic work limit (CPU-independent), so every run gives the same plans.
  # The wall-clock limit is only a safety cap; it should never be the limit that is hit.
  solver_deterministic_limit: 0.5   # model: CP-SAT deterministic time per weekly plan. Measured on two full-year runs (3,474 plans):
                                    # the 15 plans that hit the old 2-second wall limit got the same plan value in slightly less time,
                                    # and the others are proved optimal well inside it (largest 0.22 in a 1-in-10 sample)
  solver_time_limit_s: 30.0         # model: wall-clock safety cap (seconds)
  max_jobs_per_site: {community: 40, town: 400}   # model: only the top jobs by value per site enter the weekly model
  crew_full_share: 0.92      # model: a crew that used this share of its hours is "fully booked" in the reason codes
  cheapest_job_value: 1000   # ASSUMPTION "cheapest" and "floor": every job is worth the same ($-points)
  due_soon_days: 7           # ASSUMPTION jobs whose clock ends within this many days get the deadline bonus
  deadline_bonus: 400        # ASSUMPTION points added to a due-soon job under the need, official and guarantee policies
  floor_bonus: 6000          # ASSUMPTION "floor" and "guarantee": an urgent job about to breach the equal clock is worth this much more ($-points)
  ageing_points_per_day: 3   # ASSUMPTION points per day past half the clock, so nothing waits forever
  lambda_grid: [0.0, 0.02, 0.05, 0.1, 0.2, 0.4, 0.8]   # model: points per dollar of travel; the equity-efficiency dial

# Fault-days (the harm measure): harm/100 x category weight x days waited. ASSUMPTION: the weights are ours, not sourced.
harm_weights:
  immediate: 3.0             # ASSUMPTION a dangerous fault, until it is made safe
  urgent: 1.5                # ASSUMPTION
  routine: 0.5               # ASSUMPTION
  made_safe: 1.5             # ASSUMPTION an Immediate job, once made safe, weighs like an urgent one until it is fixed

joint_trips:                 # experiments.joint_trips(): trades travelling together, counted after planning
  seats: {road: 3, road-run: 3, air: 5, air-run: 5}   # ASSUMPTION: a work ute takes 3 trades and tools; a light twin 5

triage:
  category_base: {immediate: 1000, urgent: 500, routine: 100}   # ASSUMPTION urgency points per FS17 category: category comes first
  hlp_points_per_rank: 4         # ASSUMPTION (10 - Healthy Living Practice rank) x this: Safety (0) = 40 ... HLP 9 = 4
  confidence_threshold: 0.55     # ASSUMPTION below this the report goes to a person (evaluate.py sweeps it)
  tier1_points: 40               # ASSUMPTION Tier 1, life-preservation: needs power, cooling or medical supplies; newborn; frail elder
  vulnerable_points: 25          # ASSUMPTION Tier 2, high systemic risk: young children, pregnancy, illness, disability, limited mobility
  # Tier 1 + one of these faults is Immediate: losing power, water or cooling is a danger to that household. ASSUMPTION
  lifeline_faults: [no_power, no_water, aircon_fan]
  crowded_points: 10             # ASSUMPTION
  repeat_points: 10              # ASSUMPTION
  rework_points: 50              # ASSUMPTION: a fix the tenant says didn't work comes back ahead of a fresh report of the same fault
  crowded_people_per_bedroom: 2  # ASSUMPTION: more than 2 people per bedroom counts as crowded (open to co-design)
  intake_answer_rate: 0.9        # ASSUMPTION for evaluate.inclusion(): share of standard questions answered on first contact

missed_visits:                   # experiments.missed_visits(): visits that miss (no one home, can't get in, parts)
  share: 0.1                     # ASSUMPTION: 1 in 10 booked visits miss; the job keeps its clock and is re-planned

# ------------------------------------------------------------------ disasters (experiments.disaster)
# Modelled on the January 2023 Victoria River flood: Kalkarindji, Daguragu and Pigeon Hole were flooded and evacuated,
# and the Buntine Highway was cut. Damage share, faults per house and surge size are ASSUMPTIONS.
disaster:
  name: "Victoria River, January 2023 pattern"
  communities: [C48, C47, C45]   # Kalkarindji, Daguragu, Pigeon Hole (Katherine hub)
  week: 27                       # early January, counting from 1 July
  road_cut_weeks: 4              # ASSUMPTION fly-in only while the roads are cut
  damaged_share: 0.4             # ASSUMPTION: share of houses with flood damage
  faults_per_house: [1, 3]       # ASSUMPTION: each damaged house reports 1 to 3 faults over the first 2 weeks
  surge_factor: 2.0              # ASSUMPTION: the contractor panel doubles the hub's crews ...
  surge_weeks: 8                 # ... for 8 weeks
  fault_mix:                     # ASSUMPTION: what a flood breaks
    damp_mould: 0.20
    no_power: 0.15
    sewage_overflow: 0.12
    electrical_danger: 0.10
    no_water: 0.10
    stove_broken: 0.08
    kitchen: 0.08
    aircon_fan: 0.07
    structural_danger: 0.05
    security: 0.05
